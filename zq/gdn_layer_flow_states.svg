<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1850" viewBox="0 0 1560 1850">
  <style>
    text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; fill:#263238; }
    .title { font-size:30px; font-weight:bold; }
    .sub   { font-size:17px; fill:#78909c; }
    .grp   { font-size:21px; font-weight:bold; }
    .l1    { font-size:19px; font-weight:bold; }
    .ln    { font-size:17px; }
    .nb    { font-size:16px; }
    .th    { font-size:18px; font-weight:bold; }
    .td    { font-size:16px; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#546e7a"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#e65100"/>
    </marker>
  </defs>
  <rect width="1560" height="1850" fill="#ffffff"/>

  <text x="780" y="48" text-anchor="middle" class="title">GDN 层完整前向流程 × 状态池两个状态的读写时机</text>
  <text x="780" y="80" text-anchor="middle" class="sub">口径：①⑤为模型层（仓外，普通 matmul）；②③④为本仓算子｜【R】= 读状态池　【W】= 写状态池</text>

  <!-- legend -->
  <rect x="60" y="102" width="46" height="28" rx="7" fill="#f2f4f6" stroke="#8d9aa5" stroke-width="1.8"/>
  <text x="116" y="122" class="nb" font-weight="bold">模型层（仓外）</text>
  <rect x="280" y="102" width="46" height="28" rx="7" fill="#cfe3fa" stroke="#12518c" stroke-width="2"/>
  <text x="336" y="122" class="nb" font-weight="bold">本仓算子</text>
  <rect x="450" y="102" width="46" height="28" rx="7" fill="#ffe3bd" stroke="#e65100" stroke-width="2"/>
  <text x="506" y="122" class="nb" font-weight="bold">状态池（kv_cache）</text>
  <text x="700" y="122" class="nb" font-weight="bold" fill="#e65100">【R】读　【W】写　R/W 时机标在每一步内</text>

  <!-- ============ main flow column ============ -->
  <rect x="120" y="160" width="740" height="50" rx="12" fill="#ddebfa" stroke="#1565c0" stroke-width="2.5"/>
  <text x="490" y="192" text-anchor="middle" class="l1">输入：hidden_states [B, T, D]</text>
  <line x1="490" y1="210" x2="490" y2="248" stroke="#546e7a" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="120" y="252" width="740" height="66" rx="12" fill="#f2f4f6" stroke="#8d9aa5" stroke-width="1.8"/>
  <text x="490" y="279" text-anchor="middle" class="l1">① 投影（模型层 · 仓外）</text>
  <text x="490" y="305" text-anchor="middle" class="ln">hidden → 切出 q / k / v / g(logits) / β(logits)</text>
  <line x1="490" y1="318" x2="490" y2="350" stroke="#546e7a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- step 2: causal conv -->
  <rect x="120" y="354" width="740" height="252" rx="14" fill="#f6fafe" stroke="#12518c" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="490" y="386" text-anchor="middle" class="grp">② 短窗因果卷积（本仓 causal_conv1d 算子，独立 kernel 启动）</text>

  <rect x="150" y="402" width="680" height="92" rx="10" fill="#cfe3fa" stroke="#12518c" stroke-width="2"/>
  <text x="490" y="428" text-anchor="middle" class="l1">prefill · causal_conv1d_fn（整段滑窗计算）</text>
  <text x="490" y="453" text-anchor="middle" class="ln">段首：从 conv_states 装初始窗口【R】（新序列无初态则按零）</text>
  <text x="490" y="478" text-anchor="middle" class="ln">段尾：本段最后 width−1 个输入滚入 conv_states【W】</text>

  <rect x="150" y="504" width="680" height="92" rx="10" fill="#cfe3fa" stroke="#12518c" stroke-width="2"/>
  <text x="490" y="530" text-anchor="middle" class="l1">decode/spec · causal_conv1d_update（逐 token）</text>
  <text x="490" y="555" text-anchor="middle" class="ln">每步：读窗口算当前卷积输出【R】，新输入原地写回【W】</text>
  <text x="490" y="580" text-anchor="middle" class="ln">投机解码：num_accepted_tokens 回卷被拒候选的写入</text>

  <line x1="490" y1="606" x2="490" y2="636" stroke="#546e7a" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="120" y="640" width="740" height="90" rx="12" fill="#f2f4f6" stroke="#8d9aa5" stroke-width="1.8"/>
  <text x="490" y="667" text-anchor="middle" class="l1">③ 门控激活</text>
  <text x="490" y="692" text-anchor="middle" class="ln">g_t = −exp(A_log)·softplus(dt + dt_bias)；β = sigmoid(b)</text>
  <text x="490" y="716" text-anchor="middle" class="ln">模型层完成；A5 新路径 use_gate_in_kernel=True 时收进 prepare 核内</text>

  <line x1="490" y1="730" x2="490" y2="760" stroke="#546e7a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- step 4: core -->
  <rect x="120" y="764" width="740" height="430" rx="14" fill="#f6fafe" stroke="#12518c" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="490" y="796" text-anchor="middle" class="grp">④ delta-rule 核心（本仓算子）—— 两种运行形态</text>

  <rect x="150" y="812" width="680" height="212" rx="10" fill="#cfe3fa" stroke="#12518c" stroke-width="2"/>
  <text x="490" y="838" text-anchor="middle" class="l1">prefill · chunk_gated_delta_rule_fwd（A5：Prepare → FwdH → FwdO）</text>
  <text x="490" y="863" text-anchor="middle" class="ln">Prepare：L2Norm · cumsum · KKT · (I+L)⁻¹ · WY 重构（净写入 u / 系数 w）</text>
  <text x="490" y="888" text-anchor="middle" class="ln">FwdH：块间状态递推 —— 首块读 initial_state【R·S】</text>
  <text x="490" y="913" text-anchor="middle" class="ln">　　　末块写 final_state【W·S】；中间几十块 S 驻 AIV UB，零进出池</text>
  <text x="490" y="938" text-anchor="middle" class="ln">FwdO：o = 块间项（查快照 h）＋ 块内项（对净写入 u 的因果注意力）</text>
  <text x="490" y="963" text-anchor="middle" class="ln">（变长：cu_seqlens / chunk_indices 描述多条序列与分块）</text>

  <rect x="150" y="1036" width="680" height="140" rx="10" fill="#cfe3fa" stroke="#12518c" stroke-width="2"/>
  <text x="490" y="1062" text-anchor="middle" class="l1">decode/spec · recurrent_gated_delta_rule（逐 token 递推）</text>
  <text x="490" y="1087" text-anchor="middle" class="ln">每 token：读 S【R】→ 旧记忆衰减 ＋ 差额改写 → 原地写回【W】</text>
  <text x="490" y="1112" text-anchor="middle" class="ln">O(1) 单步复杂度，无 KV Cache，长上下文显存不膨胀</text>
  <text x="490" y="1137" text-anchor="middle" class="ln">投机解码：num_accepted_tokens 回卷被拒写入</text>

  <line x1="490" y1="1194" x2="490" y2="1226" stroke="#546e7a" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="120" y="1230" width="740" height="62" rx="12" fill="#f2f4f6" stroke="#8d9aa5" stroke-width="1.8"/>
  <text x="490" y="1256" text-anchor="middle" class="l1">⑤ 输出投影 ＋ 残差（模型层 · 仓外）</text>
  <text x="490" y="1280" text-anchor="middle" class="ln">o · gate_logits → 与主干 hidden 残差合并</text>

  <line x1="490" y1="1292" x2="490" y2="1322" stroke="#546e7a" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="120" y="1326" width="740" height="50" rx="12" fill="#ddebfa" stroke="#1565c0" stroke-width="2.5"/>
  <text x="490" y="1358" text-anchor="middle" class="l1">输出：o（送入下一层 / 采样）</text>

  <!-- ============ state pool column ============ -->
  <rect x="1000" y="354" width="520" height="530" rx="14" fill="#fffaf3" stroke="#e65100" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1260" y="386" text-anchor="middle" class="grp">状态池（kv_cache）</text>
  <text x="1260" y="412" text-anchor="middle" class="nb">每序列一个 slot · 跨调用持久 · GM 常驻</text>

  <rect x="1020" y="428" width="480" height="206" rx="10" fill="#ffe3bd" stroke="#e65100" stroke-width="2"/>
  <text x="1260" y="454" text-anchor="middle" class="l1">conv_states（状态池一半）</text>
  <text x="1260" y="480" text-anchor="middle" class="ln">[num_slots, width−1, dim]　width=4 → 存前 3 个 token 的 qkv 输入</text>
  <text x="1260" y="506" text-anchor="middle" class="ln">角色：卷积滑窗缓存 —— 只服务 ②</text>
  <text x="1260" y="534" text-anchor="middle" class="ln">· prefill 续算：段首【R】＋ 段尾滚入【W】</text>
  <text x="1260" y="560" text-anchor="middle" class="ln">· decode：每步【R】→ 算 →【W】原地滚动</text>
  <text x="1260" y="586" text-anchor="middle" class="ln">· 投机：回卷被拒写入</text>
  <text x="1260" y="612" text-anchor="middle" class="ln">· PCP：非首 rank all_gather 补滑窗</text>

  <rect x="1020" y="652" width="480" height="214" rx="10" fill="#ffe3bd" stroke="#e65100" stroke-width="2"/>
  <text x="1260" y="678" text-anchor="middle" class="l1">S 记忆矩阵（状态池另一半）</text>
  <text x="1260" y="704" text-anchor="middle" class="ln">[num_slots, Hv, K, V]　典型 128×128 记忆矩阵</text>
  <text x="1260" y="730" text-anchor="middle" class="ln">角色：递推记忆（delta rule 的账本）—— 只服务 ④</text>
  <text x="1260" y="758" text-anchor="middle" class="ln">· prefill：首块【R·initial_state】＋ 末块【W·final_state】</text>
  <text x="1260" y="784" text-anchor="middle" class="ln">　（一次性进出池；中间块 S 驻 AIV UB ping-pong，零搬运）</text>
  <text x="1260" y="810" text-anchor="middle" class="ln">· decode：每步【R】→ 衰减改写 →【W】原地递推</text>
  <text x="1260" y="836" text-anchor="middle" class="ln">· 投机：num_accepted_tokens 回卷</text>

  <!-- state pool <-> step arrows -->
  <line x1="994" y1="530" x2="866" y2="530" stroke="#e65100" stroke-width="2.2" stroke-dasharray="8 5" marker-start="url(#arO)" marker-end="url(#arO)"/>
  <text x="930" y="516" text-anchor="middle" class="nb" fill="#e65100" font-weight="bold">R / W</text>
  <line x1="994" y1="800" x2="866" y2="800" stroke="#e65100" stroke-width="2.2" stroke-dasharray="8 5" marker-start="url(#arO)" marker-end="url(#arO)"/>
  <text x="930" y="786" text-anchor="middle" class="nb" fill="#e65100" font-weight="bold">R / W</text>

  <!-- ============ comparison table ============ -->
  <rect x="60" y="1420" width="1440" height="330" rx="14" fill="#fffbe6" stroke="#d4a017" stroke-width="1.8"/>
  <text x="780" y="1456" text-anchor="middle" class="grp">两个状态对比一览</text>

  <text x="170" y="1496" class="th">对比项</text>
  <text x="530" y="1496" class="th" fill="#e65100">conv_states</text>
  <text x="1050" y="1496" class="th" fill="#e65100">S 记忆矩阵</text>
  <line x1="100" y1="1510" x2="1460" y2="1510" stroke="#d4a017" stroke-width="1.4"/>

  <text x="170" y="1544" class="td" font-weight="bold">形状</text>
  <text x="530" y="1544" class="td">[num_slots, width−1, dim]</text>
  <text x="1050" y="1544" class="td">[num_slots, Hv, K, V]</text>

  <text x="170" y="1580" class="td" font-weight="bold">语义</text>
  <text x="530" y="1580" class="td">卷积滑窗缓存（局部性）</text>
  <text x="1050" y="1580" class="td">递推记忆（delta rule 账本）</text>

  <text x="170" y="1616" class="td" font-weight="bold">服务的步骤</text>
  <text x="530" y="1616" class="td">② 因果卷积</text>
  <text x="1050" y="1616" class="td">④ delta-rule 核心</text>

  <text x="170" y="1652" class="td" font-weight="bold">prefill 时机</text>
  <text x="530" y="1652" class="td">段首 R ＋ 段尾 W（每个 prefill 段各一次）</text>
  <text x="1050" y="1652" class="td">首块 R(initial_state) ＋ 末块 W(final_state)，一次性</text>

  <text x="170" y="1688" class="td" font-weight="bold">decode 时机</text>
  <text x="530" y="1688" class="td">每步 R → W 原地滚动</text>
  <text x="1050" y="1688" class="td">每步 R → W 原地递推</text>

  <text x="170" y="1724" class="td" font-weight="bold">投机解码回卷</text>
  <text x="530" y="1724" class="td">支持（run_mode=1）</text>
  <text x="1050" y="1724" class="td">支持（num_accepted_tokens）</text>

  <text x="780" y="1790" text-anchor="middle" class="nb" fill="#7a5c00">两个状态都是 GM 常驻、按 slot 管理的持久张量；本仓均按 mutable 参数处理（schema Tensor(a!) ＋ MUTATED_ARGUMENTS ＋ version counter）——prefill 结束各写回一次，decode 每步原地更新，续算 prefill / decode 从同一槽位接续。</text>
</svg>
