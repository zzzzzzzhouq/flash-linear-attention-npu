</g>
<rect x="980" y="175" width="340" height="125" rx="14" fill="#54A24B"/><text x="1150" y="218" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="white">结构优化候选</text><text x="1150" y="254" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="white">V 逻辑列切分：2×64 → 8 核组</text>
<text x="70" y="440" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700" fill="#172B4D">B=1、HV=4 → 只有 4 个核组；同一 head 的 139 次递推不能按 chunk 并行。</text>
<line x1="55" y1="480" x2="1345" y2="480" stroke="#D0D5DD" stroke-width="2"/>
