<text x="70" y="755" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700" fill="#172B4D">4 处 PIPE_S 保持现状，不再为本问题修改。</text>
<text x="70" y="800" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#667085">重新采集后：先查槽 63 不再跳到 kernel 末尾，再做跨 Stage 依赖和全时段性能分析。</text>
