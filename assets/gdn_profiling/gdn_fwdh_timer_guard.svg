<text x="55" y="92" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#667085">代码结构可以确认；长 trace 的跨 Stage 形状和绝对时长必须等采样修复后再判定</text>
