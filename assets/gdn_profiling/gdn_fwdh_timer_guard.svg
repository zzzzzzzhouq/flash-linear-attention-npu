<path d="M420 550 C360 535 305 540 285 560" fill="none" stroke="#D92D20" stroke-width="3" marker-end="url(#a)"/><text x="430" y="550" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#D92D20">后续事件反复覆盖</text>
<text x="70" y="680" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="700" fill="#D92D20">不同 Stage 的末尾槽来自不同轮次 → 假倒挂／假长链</text>
<text x="760" y="530" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#039855">正确修法：Guard 丢弃溢出采样</text>
<g font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" text-anchor="middle"><rect x="760" y="565" width="145" height="62" rx="8" fill="#6C8EBF"/><text x="832" y="604" fill="white">0…62</text><rect x="925" y="565" width="90" height="62" rx="8" fill="#6C8EBF"/><text x="970" y="604" fill="white">63</text><rect x="1035" y="565" width="105" height="62" rx="8" fill="#98A2B3"/><text x="1087" y="604" fill="white">≥64</text></g>
