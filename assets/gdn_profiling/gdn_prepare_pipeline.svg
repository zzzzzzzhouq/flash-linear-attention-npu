<text x="330" y="305" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#D92D20">首次交接：notify→KKT 6.460 µs</text>
<text x="675" y="135" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#B54708">稳态 S3 EPI/core ≈ 3.8 µs／pack</text>
<text x="915" y="305" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#667085">S6 与 S4/S5 重叠</text>
<text x="1120" y="135" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#476A9B">下一包 S1 覆盖上一包 S5/S7</text>
<text x="90" y="570" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#172B4D">正确读法：窗口跨 AIC／AIV 且互相重叠，不能相加；KKT MMAD 窗口小，不等于 KKT 供给没有延迟。</text>
<text x="90" y="620" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700" fill="#172B4D">优化顺序：Stage3 数据链 → KKT dump／notify 与 AIC 后段 → S5/S7 重复搬运。</text>
<text x="90" y="675" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#667085">8960：28 核组，每核组 5 packs；512：8 核组，每核组 1 pack。</text>
