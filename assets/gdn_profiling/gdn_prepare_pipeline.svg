<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#667085"/></marker><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
<rect width="1400" height="760" fill="white"/>
<text x="55" y="58" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#172B4D">Prepare：CV 依赖与跨 pack 重叠</text>
<text x="55" y="92" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#667085">依赖示意，非时间比例；S3 与首次跨 pack 交接是当前重点</text>
<text x="55" y="235" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#172B4D">AIV</text><text x="55" y="445" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#172B4D">AIC</text>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">
<rect x="130" y="165" width="175" height="90" rx="12" fill="#4C78A8"/><text x="217" y="202">S1</text><text x="217" y="230">k 上传 / notify</text>
<rect x="355" y="375" width="165" height="90" rx="12" fill="#F58518"/><text x="437" y="412">S2</text><text x="437" y="440">KKT</text>
<rect x="570" y="165" width="210" height="90" rx="12" fill="#E76F51"/><text x="675" y="202">S3</text><text x="675" y="230">L / 叶块 / L1</text>
