<rect x="830" y="165" width="180" height="90" rx="12" fill="#4C78A8"/><text x="920" y="202">S6</text><text x="920" y="230">vb / kbg</text>
<rect x="1200" y="375" width="150" height="90" rx="12" fill="#F58518"/><text x="1275" y="412">S7</text><text x="1275" y="440">W / U</text>
<rect x="1175" y="165" width="175" height="90" rx="12" fill="#6C8EBF"/><text x="1262" y="202">下一 pack S1</text><text x="1262" y="230">提前进入</text>
</g>
